# Levier — Docker Compose single-node MVP.
#
# Core services:
#   postgres      PostgreSQL 16
#   levier        Go control plane
#   mcp-runtime   independent MCP runtime (runtime 1)
#   harness       Python Agent runtime (runtime 2)
#   agent         counter_agent App
#
# Smoke profile:
#   docker compose --profile smoke run --rm smoke
#
# Copyright 2026 The Levier Authors.

name: levier-mvp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: levier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: levier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levier -d levier"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  levier:
    build:
      context: .
      dockerfile: deploy/levier.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        VERSION: ${LEVIER_VERSION:-dev}
        COMMIT: ${LEVIER_COMMIT:-unknown}
        BUILD_TIME: ${LEVIER_BUILD_TIME:-unknown}
    environment:
      LEVIER_DATABASE_URL: postgres://levier:${POSTGRES_PASSWORD:-change-me}@postgres:5432/levier?sslmode=disable
      LEVIER_HTTP_ADMIN_TOKEN: ${LEVIER_ADMIN_TOKEN:-${MW_ADMIN_TOKEN:-admin-change-me}}
      LEVIER_LOG_LEVEL: ${LEVIER_LOG_LEVEL:-${MW_LOG_LEVEL:-info}}
      LEVIER_LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mcp-runtime:
    build:
      context: .
      dockerfile: deploy/mcp-runtime.Dockerfile
    command: ["--socket", "/run/levier/mcp.sock"]
    environment:
      LEVIER_SECRET_E2E_TOKEN: ${MCP_E2E_TOKEN:-mcp-e2e-secret}
    volumes:
      - mcp_socket:/run/levier
    healthcheck:
      test: ["CMD-SHELL", "test -e /run/levier/mcp.sock"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  harness:
    build:
      context: .
      dockerfile: deploy/harness.Dockerfile
    environment:
      HARNESS_LEVIER_ADDRESS: levier:9090
      HARNESS_DAEMON_ID: daemon-local-1
      HARNESS_DAEMON_AUTH_TOKEN: change-me
      HARNESS_MCP_RUNTIME_SOCKET: /run/levier/mcp.sock
      HARNESS_LOGGING_FORMAT: json
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    volumes:
      - mcp_socket:/run/levier
    depends_on:
      levier:
        condition: service_healthy
      mcp-runtime:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: deploy/agent.Dockerfile
    environment:
      LEVIER_URL: http://levier:8080
      LEVIER_ADMIN_TOKEN: ${LEVIER_ADMIN_TOKEN:-${MW_ADMIN_TOKEN:-admin-change-me}}
      LEVIER_APP_NAME: ${LEVIER_APP_NAME:-${MW_APP_NAME:-counter-agent}}
      COUNTER_APP_CREDENTIALS: /data/credentials.json
    volumes:
      - agent_data:/data
    depends_on:
      levier:
        condition: service_healthy
    restart: unless-stopped

  smoke:
    image: python:3.12-slim
    command: ["python", "/app/smoke.py"]
    environment:
      LEVIER_URL: http://levier:8080
      MCP_SOCKET: /run/levier/mcp.sock
      CREDENTIALS: /data/credentials.json
      DAEMON_ID: daemon-local-1
    volumes:
      - ./deploy/smoke.py:/app/smoke.py:ro
      - mcp_socket:/run/levier
      - agent_data:/data
    depends_on:
      levier:
        condition: service_healthy
      mcp-runtime:
        condition: service_healthy
      harness:
        condition: service_started
      agent:
        condition: service_started
    profiles: ["smoke"]

volumes:
  pgdata:
  mcp_socket:
  agent_data:

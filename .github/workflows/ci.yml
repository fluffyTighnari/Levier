# Levier — continuous integration.
# Copyright 2026 The Levier Authors.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: make lint   # fmt + vet + secrets + structure
      - run: make deps-check
      - run: make test
      - run: make build

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Ensure main branch for buf breaking
        run: |
          git fetch origin main
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
      - run: make proto-lint
      - run: make proto-check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall execution/runtime_sdk/src execution/echo_runtime/src execution/react_runtime/src execution/langgraph_runtime/src sdk/python/src sdk/levier/src
      - run: python -m pip install --upgrade pip
      # react_runtime depends on the local workspace package levier-agent-core.
      # pip does not understand [tool.uv.sources], so install it explicitly first.
      - run: python -m pip install -e ./execution/agent_core
      - run: python -m pip install -e ./execution/runtime_sdk
      - run: python -m pip install -e ./execution/echo_runtime
      - run: python -m pip install -e ./execution/react_runtime
      - run: python -m pip install -e ./execution/langgraph_runtime
      - run: python -m pip install -e ./sdk/python
      - run: python -m pip install -e ./sdk/levier
      - run: PYTHONPATH=execution/runtime_sdk/src:execution/react_runtime/src python tests/contract/test_contract.py -v
      - run: PYTHONPATH=execution/agent_core/src:execution/runtime_sdk/src:execution/react_runtime/src python -m unittest discover -s execution/react_runtime/tests -v
      - run: PYTHONPATH=execution/agent_core/src:execution/runtime_sdk/src python -m unittest discover -s execution/runtime_sdk/tests -v
      - run: PYTHONPATH=execution/runtime_sdk/src:execution/langgraph_runtime/src python -m unittest discover -s execution/langgraph_runtime/tests -v
      - run: PYTHONPATH=execution/runtime_sdk/src python -m levier_echo_runtime --config execution/echo_runtime/runtime.yaml --check
      - run: PYTHONPATH=sdk/levier/src:sdk/python/src python -m unittest discover -s sdk/python/tests -v
      - run: PYTHONPATH=sdk/levier/src:sdk/python/src python -m unittest discover -s sdk/levier/tests -v
      - run: PYTHONPATH=sdk/levier/src:sdk/python/src python -m unittest discover -s examples/counter_agent/tests -v

# Levier — continuous integration.
# Copyright 2026 The Levier Authors.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: make lint   # fmt + vet + secrets + structure
      - run: make deps-check
      - run: make test
      - run: make build

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - run: make proto-lint
      - run: make proto-check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall execution/harness/src
      - run: python -m pip install --upgrade pip
      # harness depends on the local workspace package levier-agent-core.
      # pip does not understand [tool.uv.sources], so install it explicitly first.
      - run: python -m pip install -e ./execution/agent_core
      - run: python -m pip install -e ./execution/harness
      - run: PYTHONPATH=execution/harness/src/gen:execution/harness/src python tests/contract/test_contract.py -v
      - run: PYTHONPATH=execution/harness/src/gen:execution/harness/src python -m unittest discover -s execution/harness/tests -v

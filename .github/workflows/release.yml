# Levier — release workflow.
#
# Tag v* -> verify -> release archives + GHCR images.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: make lint
      - run: make deps-check
      - run: make test

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "release tag must look like vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
              exit 2
              ;;
          esac
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$VERSION" COMMIT="$COMMIT" BUILT="$BUILT" sh scripts/build-release.sh
          test -s dist/checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            if printf '%s' "$VERSION" | grep -q -- '-'; then
              gh release create "$VERSION" dist/* \
                --title "$VERSION" \
                --generate-notes \
                --verify-tag \
                --prerelease
            else
              gh release create "$VERSION" dist/* \
                --title "$VERSION" \
                --generate-notes \
                --verify-tag
            fi
          fi

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: levier
            file: deploy/levier.Dockerfile
          - image: levier-runtime
            file: deploy/runtime.Dockerfile
          - image: levier-mcp-runtime
            file: deploy/mcp-runtime.Dockerfile
          - image: levier-agent
            file: deploy/agent.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "release tag must look like vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
              exit 2
              ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push levier
        if: matrix.image == 'levier'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Build and push runtime image
        if: matrix.image != 'levier'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  go-install:
    needs: release
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install from tag and verify version
        env:
          VERSION: ${{ github.ref_name }}
          GOPROXY: direct
        run: |
          set -eu
          GOBIN="$RUNNER_TEMP/bin" go install github.com/fluffyTighnari/levier/cmd/levier@"$VERSION"
          "$RUNNER_TEMP/bin/levier" version

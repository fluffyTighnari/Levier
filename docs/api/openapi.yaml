# Levier — App HTTP API v1 (OpenAPI 3.1 skeleton).
# Copyright 2026 The Levier Authors.

openapi: 3.1.0
info:
  title: Levier App API
  version: "1.0.0"
  description: |
    App-facing HTTP API for run submission, event replay, cancellation,
    sessions, and App/Tool/MCP registration. Every response carries an
    `X-Request-ID` header; error envelopes repeat it as `error.request_id`.
    The WebSocket contract is documented separately at `/api/v1/ws`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /meta:
    servers:
      - url: /
    get:
      summary: Service self-description
      operationId: meta
      security: []
      responses:
        "200":
          description: Public service identity, protocol versions, capabilities, limits, auth schemes, and endpoints
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /status:
    servers:
      - url: /
    get:
      summary: Runtime status overview
      operationId: status
      security: []
      responses:
        "200":
          description: Aggregate daemon, App, Run, workflow, and health status without resource identifiers or secrets
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /healthz:
    get:
      summary: Liveness check
      operationId: health
      security: []
      responses:
        "200":
          description: Levier is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness check (database)
      operationId: ready
      security: []
      responses:
        "200":
          description: Levier and database are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /admin/apps:
    get:
      summary: List App metadata without API keys
      operationId: listApps
      security:
        - adminToken: []
      responses:
        "200":
          description: App metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppListResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create an App and return its API key once
      operationId: createApp
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpsertRequest'
      responses:
        "201":
          description: App created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAppResponse'
        default:
          $ref: '#/components/responses/Error'
  /admin/apps/{app_id}/rotate-key:
    post:
      summary: Rotate an App API key
      operationId: rotateAppKey
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/AppID'
      responses:
        "200":
          description: New API key returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/runs:
    get:
      summary: List runs for operators
      operationId: listAdminRuns
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          description: Comma-separated run statuses
          schema:
            type: string
        - name: app_id
          in: query
          schema:
            type: string
        - name: daemon_id
          in: query
          schema:
            type: string
        - name: session_id
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Run page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRunListResponse'
        default:
          $ref: '#/components/responses/Error'
  /admin/runs/{run_id}:
    get:
      summary: Get one run with workflow tasks
      operationId: getAdminRun
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRunView'
        default:
          $ref: '#/components/responses/Error'
  /admin/runs/{run_id}/cancel:
    post:
      summary: Cancel a run as an operator
      operationId: cancelAdminRun
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Run cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunResponse'
        default:
          $ref: '#/components/responses/Error'
  /admin/runs/{run_id}/resume:
    post:
      summary: Resume a waiting run as an operator
      operationId: resumeAdminRun
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRunRequest'
      responses:
        "200":
          description: Run resume result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeRunResponse'
        default:
          $ref: '#/components/responses/Error'
  /admin/daemons:
    get:
      summary: List connected daemon capacity
      operationId: listAdminDaemons
      security:
        - adminToken: []
      responses:
        "200":
          description: Daemon list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDaemonListResponse'
        default:
          $ref: '#/components/responses/Error'
  /admin/tasks:
    get:
      summary: List workflow tasks for operators
      operationId: listAdminTasks
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          description: Comma-separated task statuses
          schema:
            type: string
        - name: type
          in: query
          description: Comma-separated task types
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTaskListResponse'
        default:
          $ref: '#/components/responses/Error'
  /model-providers:
    get:
      summary: List enabled model providers for the authenticated App
      operationId: listModelProviders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider catalog without keys or secret references
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        adapter: {type: string}
                        base_url: {type: string}
                        default_model: {type: string}
                        models:
                          type: array
                          items: {type: string}
                        default: {type: boolean}
        default:
          $ref: '#/components/responses/Error'
  /admin/model-providers:
    get:
      summary: List model providers for operators
      operationId: listAdminModelProviders
      security:
        - adminToken: []
      responses:
        "200":
          description: Provider catalog with secret reference status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or update a model provider
      operationId: upsertModelProvider
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, adapter, secret_ref]
              properties:
                name: {type: string}
                adapter: {type: string, enum: [openai_compatible, anthropic]}
                base_url: {type: string}
                default_model: {type: string}
                models:
                  type: array
                  items: {type: string}
                secret_ref: {type: string}
                enabled: {type: boolean}
                default: {type: boolean}
      responses:
        "200":
          description: Saved provider view
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /admin/model-providers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Get a model provider
      operationId: getModelProvider
      security:
        - adminToken: []
      responses:
        "200":
          description: Provider view
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a model provider
      operationId: deleteModelProvider
      security:
        - adminToken: []
      responses:
        "200":
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /admin/model-providers/{name}/secret:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    put:
      summary: Store a provider key in the control-plane managed secret file
      operationId: putModelProviderSecret
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: {type: string}
      responses:
        "200":
          description: Provider view with secret_configured=true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /admin/model-providers/{name}/check:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Check provider metadata and secret resolution
      operationId: checkModelProvider
      security:
        - adminToken: []
      responses:
        "200":
          description: Provider is configured
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /apps:
    post:
      summary: Update the authenticated App
      operationId: updateApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpsertRequest'
      responses:
        "200":
          description: App updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppView'
        default:
          $ref: '#/components/responses/Error'
  /apps/{app_id}:
    get:
      summary: Read an App registration
      operationId: getApp
      parameters:
        - $ref: '#/components/parameters/AppID'
      responses:
        "200":
          description: App registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppView'
        default:
          $ref: '#/components/responses/Error'
  /runs:
    post:
      summary: Submit a run
      operationId: createRun
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        "503":
          description: Dispatch queue unavailable; retry with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /runs/{run_id}:
    get:
      summary: Read run status
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        "200":
          description: Run projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        default:
          $ref: '#/components/responses/Error'
  /runs/{run_id}/events:
    get:
      summary: Replay persisted run events
      operationId: listRunEvents
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/AfterAttempt'
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Persisted events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        default:
          $ref: '#/components/responses/Error'
  /runs/{run_id}/cancel:
    post:
      summary: Cancel a run
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRunRequest'
      responses:
        "200":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunResponse'
        default:
          $ref: '#/components/responses/Error'
  /runs/{run_id}/resume:
    post:
      summary: Resume a waiting longterm run
      operationId: resumeRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRunRequest'
      responses:
        "200":
          description: Run requeued for another attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeRunResponse'
        default:
          $ref: '#/components/responses/Error'
  /sessions:
    get:
      summary: List longterm sessions for the authenticated App
      operationId: listSessions
      parameters:
        - name: app_id
          in: query
          required: false
          description: Required for admin/legacy bearer credentials.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        default:
          $ref: '#/components/responses/Error'
  /sessions/{session_id}/close:
    post:
      summary: Close a longterm session that has no active runs
      operationId: closeSession
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: app_id
          in: query
          required: false
          description: Required for admin/legacy bearer credentials.
          schema:
            type: string
      responses:
        "200":
          description: Closed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        default:
          $ref: '#/components/responses/Error'
  /sessions/{session_id}:
    get:
      summary: Read a longterm session
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        "200":
          description: Session projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        default:
          $ref: '#/components/responses/Error'
  /sessions/{session_id}/events:
    get:
      summary: Replay persisted session events across runs
      operationId: listSessionEvents
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/AfterAttempt'
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Persisted events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        default:
          $ref: '#/components/responses/Error'
  /ws-token:
    post:
      summary: Issue a fresh short-lived WebSocket token
      operationId: issueWSToken
      parameters:
        - name: app_id
          in: query
          required: false
          description: Required for admin/legacy bearer credentials.
          schema:
            type: string
      responses:
        "200":
          description: WebSocket token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSTokenResponse'
        default:
          $ref: '#/components/responses/Error'
  /ws:
    get:
      summary: App WebSocket (protocol v1)
      description: |
        Upgrade to the App WebSocket. Client sends hello/subscribe/
        local_tool_result/ping; server sends event/local_tool_call/
        run_completed/caught_up/pong/error.

        `local_tool_result.correlation_id` must equal the `msg_id` of the
        corresponding `local_tool_call`. Unknown invocations return
        `LOCAL_TOOL_UNKNOWN`, foreign invocations return
        `LOCAL_TOOL_FORBIDDEN`, and mismatched correlation returns
        `LOCAL_TOOL_CORRELATION_MISMATCH`. Duplicate results are idempotent.
      operationId: appWebSocket
      responses:
        "101":
          description: Switching Protocols
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminToken:
      type: http
      scheme: bearer
  parameters:
    AppID:
      name: app_id
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    AfterAttempt:
      name: after_attempt
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    AfterSeq:
      name: after_seq
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
  responses:
    Error:
      description: Structured middleware error
      headers:
        X-Request-ID:
          description: Per-request correlation ID
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        database:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            request_id:
              type: string
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
        content:
          type: string
        name:
          type: string
    ModelRequest:
      type: object
      description: provider and model are optional when a default provider is configured
      properties:
        provider:
          type: string
        model:
          type: string
        params:
          type: object
          additionalProperties:
            type: string
    TimeoutRequest:
      type: object
      properties:
        run_ms:
          type: integer
          format: int64
          minimum: 0
        tool_ms:
          type: integer
          format: int64
          minimum: 0
    CreateRunRequest:
      type: object
      required: [runtime_name, input]
      properties:
        app_id:
          type: string
        runtime_name:
          type: string
          description: App-facing runtime routing name such as react1.
        params:
          type: object
          additionalProperties: true
        input:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        session_id:
          type: string
        model:
          $ref: '#/components/schemas/ModelRequest'
        timeouts:
          $ref: '#/components/schemas/TimeoutRequest'
    CreateRunResponse:
      type: object
      required: [run_id, status, ws_url, ws_token]
      properties:
        run_id:
          type: string
        status:
          type: string
        session_id:
          type: string
        ws_url:
          type: string
        ws_token:
          type: string
    RunView:
      type: object
      required: [run_id, app_id, runtime_name, status, attempt, created_at, updated_at]
      properties:
        run_id:
          type: string
        app_id:
          type: string
        runtime_name:
          type: string
        status:
          type: string
        attempt:
          type: integer
          format: int32
        session_id:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RunEventView:
      type: object
      required: [run_id, attempt, seq, source, event_type, ts_ms]
      properties:
        run_id:
          type: string
        attempt:
          type: integer
          format: int32
        seq:
          type: integer
          format: int64
        source:
          type: string
          enum: [daemon, mw]
        event_type:
          type: string
        data:
          type: object
          additionalProperties: true
        ts_ms:
          type: integer
          format: int64
    EventListResponse:
      type: object
      required: [events, caught_up]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/RunEventView'
        caught_up:
          type: boolean
        next_attempt:
          type: integer
          format: int32
        next_seq:
          type: integer
          format: int64
    CancelRunRequest:
      type: object
      properties:
        reason:
          type: string
    WSTokenResponse:
      type: object
      required: [ws_url, ws_token, expires_in]
      properties:
        ws_url:
          type: string
        ws_token:
          type: string
        expires_in:
          type: integer
          format: int64
    CancelRunResponse:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
        status:
          type: string
    ResumeRunRequest:
      type: object
      properties:
        resume:
          description: Opaque JSON value passed to the resumed runtime.
    ResumeRunResponse:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
        session_id:
          type: string
        status:
          type: string
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionView'
    SessionView:
      type: object
      required: [session_id, app_id, status, event_attempt, event_watermark, created_at, updated_at]
      properties:
        session_id:
          type: string
        app_id:
          type: string
        status:
          type: string
        current_run_id:
          type: string
        event_attempt:
          type: integer
          format: int32
        event_watermark:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    ToolDefinition:
      type: object
      required: [name, schema]
      properties:
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
        timeout_ms:
          type: integer
          format: int64
          minimum: 0
    AppUpsertRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        multiagent:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolDefinition'
        mcp_refs:
          type: array
          items:
            type: string
    AppView:
      type: object
      required: [app_id, name, multiagent, status, created_at, updated_at]
      properties:
        app_id:
          type: string
        name:
          type: string
        multiagent:
          type: boolean
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateAppResponse:
      type: object
      required: [app, api_key]
      properties:
        app:

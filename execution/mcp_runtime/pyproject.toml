[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levier-mcp-runtime"
version = "0.1.0"
description = "Independent MCP runtime process for the Levier execution layer"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
levier-mcp-runtime = "levier_mcp_runtime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

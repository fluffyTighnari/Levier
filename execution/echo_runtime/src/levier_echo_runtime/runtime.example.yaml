middleware:
  address: "127.0.0.1:9090"
  tls: false
  auth_token: "change-me"

runtime:
  name: "echo1"
  instance_id: "echo-local-1"
  type: "normal"
  max_concurrent_runs: 4
  labels:
    pool: "local"

logging:
  level: "info"

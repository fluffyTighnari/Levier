[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levier-echo-runtime"
version = "0.1.0"
description = "Minimal built-in echo runtime for Levier"
requires-python = ">=3.12"
dependencies = [
    "levier-runtime",
]

[tool.uv.sources]
levier-runtime = { path = "../runtime_sdk", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
levier_echo_runtime = ["runtime.example.yaml"]

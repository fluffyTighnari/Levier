# Levier — harness example configuration.
# Copyright 2026 The Levier Authors.

middleware:
  address: "127.0.0.1:9090"
  tls: false

mcp_runtime:
  socket: "/tmp/levier-mcp.sock"

daemon:
  id: "daemon-local-1"
  auth_token: "change-me"
  # Production: prefer auth_token_file or LEVIER_HARNESS_DAEMON_AUTH_TOKEN.
  # auth_token_file: "/run/secrets/levier_harness_daemon_token"
  runtime_type: "normal"
  max_concurrent_runs: 4
  strategies: ["react", "echo"]
  labels:
    pool: "local"

logging:
  level: "info"
  format: "json"

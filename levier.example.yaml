config_version: 1
environment: development

http:
  addr: ":8080"
  read_timeout: "15s"
  write_timeout: "30s"
  shutdown_timeout: "10s"
  admin_token: "admin-change-me"
  # Production: prefer admin_token_file or LEVIER_HTTP_ADMIN_TOKEN.
  # admin_token_file: "/run/secrets/levier_admin_token"
  # Compatibility switch; keep false in production.
  allow_legacy_bearer: false
  ws_token_ttl: "10m"
  # Production: use the same secret on every control/API replica.
  # ws_token_secret: "change-me"
  # Set when Apps reach the gateway through a proxy or load balancer.
  # public_ws_url: "wss://levier.example.com/api/v1/ws"

gateway:
  # Unique per process. Defaults to hostname-pid when omitted.
  instance_id: "levier-local-1"
  # all keeps the single-process compatibility mode.
  roles: ["all"]
  heartbeat_interval: "10s"
  lease_ttl: "30s"

grpc:
  addr: ":9090"
  # Separate role-to-role listener for control/api, runtime-gateway, and
  # app-gateway. Leave empty in single-process mode.
  # internal_addr: ":9091"
  # internal_token: "change-me"
  # internal_token_file: "/run/secrets/levier_internal_token"
  max_recv_msg_bytes: 16777216
  max_send_msg_bytes: 16777216
  shutdown_timeout: "10s"
  daemon_tokens:
    daemon-local-1: "change-me"
    echo-local-1: "change-me"
    # "*" lets a locally started custom runtime register without inventing a
    # daemon id/token pair. Remove it in shared or production deployments.
    "*": "change-me"
  # Production: prefer daemon_tokens_file or LEVIER_GRPC_DAEMON_TOKENS_FILE.
  # daemon_tokens_file: "/run/secrets/levier_daemon_tokens.json"

database:
  url: "postgres://change-me:change-me@localhost:5432/levier?sslmode=disable"
  # Production: prefer url_file or LEVIER_DATABASE_URL.
  # url_file: "/run/secrets/levier_database_url"
  max_conns: 20
  min_conns: 2
  connect_timeout: "5s"
  health_timeout: "2s"

workflow:
  workers: 4
  lease_ttl: "30s"
  poll_interval: "200ms"
  max_attempts: 5
  reap_interval: "10s"
  reap_limit: 100
  recovery_delay: "10s"
  event_buffer: 256

# Offline data maintenance is disabled by default.
# Enable it only when you are ready to run `levier maintenance prune --yes`.
retention:
  enabled: false
  run_days: 30
  session_days: 7
  batch_size: 1000

log:
  level: "info"
  format: "json"

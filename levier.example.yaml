# Copyright 2026 The Middleware Authors.

http:
  addr: ":8080"
  read_timeout: "15s"
  write_timeout: "30s"
  shutdown_timeout: "10s"
  admin_token: "admin-change-me"
  # Compatibility switch; keep false in production.
  allow_legacy_bearer: false

grpc:
  addr: ":9090"
  max_recv_msg_bytes: 16777216
  max_send_msg_bytes: 16777216
  shutdown_timeout: "10s"
  daemon_tokens:
    daemon-local-1: "change-me"

database:
  url: "postgres://change-me:change-me@localhost:5432/levier?sslmode=disable"
  max_conns: 20
  min_conns: 2
  connect_timeout: "5s"
  health_timeout: "2s"

workflow:
  workers: 4
  lease_ttl: "30s"
  poll_interval: "200ms"
  max_attempts: 5
  reap_interval: "10s"
  reap_limit: 100
  recovery_delay: "10s"
  event_buffer: 256

log:
  level: "info"
  format: "json"

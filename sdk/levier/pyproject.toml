[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levier"
version = "0.1.0"
description = "The small, friendly Levier Python surface for Apps and Runtimes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "levier-app==0.1.0",
  "levier-runtime==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "middleware-harness"
version = "0.1.0"
description = "Stripped-down Python harness for the middleware agent runtime"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.75.0",
    "protobuf>=7.36.2",
    "pydantic>=2.14.3",
    "PyYAML>=6.0",
    "middleware-agent-core",
]

[tool.uv.sources]
middleware-agent-core = { path = "../agent_core", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
